name: Test & Deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    # Required repo secrets:
    #   CLOUDFLARE_API_TOKEN  — API token with Workers Scripts, D1, Vectorize and Queues edit permissions
    #   CLOUDFLARE_ACCOUNT_ID — your Cloudflare account id (dashboard → Workers & Pages → right sidebar)
    # Optional:
    #   WORKER_API_TOKEN      — bearer token your agents will use; uploaded as the worker's API_TOKEN secret
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Provision Cloudflare resources (idempotent)
        run: node scripts/provision.mjs

      - name: Deploy worker
        run: npx wrangler deploy

      - name: Upload worker API_TOKEN secret
        env:
          WORKER_API_TOKEN: ${{ secrets.WORKER_API_TOKEN }}
        run: |
          if [ -n "$WORKER_API_TOKEN" ]; then
            printf '%s' "$WORKER_API_TOKEN" | npx wrangler secret put API_TOKEN
          else
            echo "WORKER_API_TOKEN secret not set — skipping (API will be open until you set it)."
          fi
